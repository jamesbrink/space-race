# Tool configuration only: this is not a Python package. The scripts run inside Blender.

[tool.ruff]
target-version = "py311" # Blender 5.x ships Python 3.11+
line-length = 150
extend-exclude = [".claude", "node_modules", "dist", "public"]
# so `import srlib` and the shared hardware modules sort as first-party
src = ["tools/blender", "missions/*/*/vehicles", "missions/*/*/sites", "missions/*/*/crew"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "B905", # zip(xs, xs[1:]) walks neighbouring pairs: uneven on purpose
  "B023", # callbacks handed to MeshBuilder.grid/lathe are called before the loop moves on
]

[tool.ruff.lint.isort]
# Blender's own modules: importable only inside Blender
known-third-party = ["bpy", "bmesh", "mathutils"]
