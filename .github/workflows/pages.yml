name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the push touched. A change to the documents alone (Markdown, docs/) changes nothing the site ships and nothing
  # a simulator test reads, so it gets the documents' own test and no more: no test run, no build, no deploy.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          from="${BASE:-$BEFORE}"
          if [ -n "$from" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
            git diff --name-only "$from" HEAD > changed.txt
            if [ -s changed.txt ] && ! grep -qvE '(\.md$|^docs/)' changed.txt; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # the documents alone: layout.md still names every file (tests/layout.test.mjs reads only the tree and that file)
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/layout.test.mjs

  # typecheck, lint, format check: the first three parts of the `pnpm check` people run before a commit
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # puts ruff on PATH; keep the version in step with the one flake.lock gives the devshell
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.3
          args: --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm format:check

  # the fourth part, `pnpm test`, split over four runners: the flights of days make it a quarter of an hour on one
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test --test-shard=${{ matrix.shard }}/4 "tests/*.test.mjs"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, then bundle. The GLBs are committed, so CI needs no Blender.
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The browser suites as a smoke test: the front page, Back and Forward, a flight's places, against the dev server
  # in the runner's Chrome (tools/browser.mjs finds it on PATH). The runner has no GPU, so it draws on SwiftShader,
  # and SwiftShader is far too slow for these suites: on a 32-core machine the front page alone took 1.8 to 2.6 s a
  # frame at 1280x800, its moving checks failed, and a launch site did not finish loading in three minutes. So the
  # job runs only when asked for (Actions, "Run workflow"), never blocks a deploy, and waits for a runner with a GPU.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      SR_URL: http://localhost:5180/
      SR_ANGLE: swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dev server
        run: |
          pnpm dev --port 5180 --strictPort > vite.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done
          cat vite.log
          exit 1
      - run: node tools/front-test.mjs --no-idle
      - if: success() || failure()
        run: node tools/history-test.mjs
      - if: success() || failure()
        run: node tools/places-test.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
